# ChmlFrp forwards only these loopback listeners. The TLS key stays on this Mac.
# Use with compose.research.yaml and compose.research.public.yaml.
services:
  public-tls:
    image: caddy:2.11.7-alpine@sha256:24ec7b05bc532c7bb57f727030c5056e257ff7138b4b50460306819ff79362bd
    container_name: ${RESEARCH_PROJECT:-context-workspace}-public-tls
    ports:
      - "127.0.0.1:8092:443"
      - "127.0.0.1:8093:80"
    volumes:
      - ./deploy/research-public/Caddyfile:/etc/caddy/Caddyfile:ro
      - research-public-tls-data:/data
      - research-public-tls-config:/config
    networks:
      - WeKnora-network
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.5

volumes:
  research-public-tls-data:
  research-public-tls-config:
