map $http_upgrade $trial_connection_upgrade {
    default upgrade;
    '' close;
}

limit_req_zone $binary_remote_addr zone=trial_login:1m rate=30r/m;
log_format trial '$remote_addr $request_method $uri $status';

server {
    listen 80;
    server_name _;
    server_tokens off;
    access_log /var/log/nginx/access.log trial;
    client_max_body_size 50m;
    # TLS and HTTP-to-HTTPS redirects are handled by the public TLS gateway.
    # This loopback-only gateway also supports the legacy relay for rollback.
    add_header Strict-Transport-Security "max-age=86400" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Public trial accounts are created locally by an administrator or via
    # the platform's authenticated invitation flow. Never expose open signup.
    location = /api/v1/auth/register {
        default_type application/json;
        return 403 '{"success":false,"message":"试用账号请联系平台管理员开通，或使用邀请链接。"}';
    }
    location = /api/v1/auth/auto-setup {
        return 403;
    }
    location = /api/v1/auth/config {
        proxy_pass http://frontend:80;
        proxy_set_header Accept-Encoding "";
        sub_filter_types application/json;
        sub_filter '"registration_mode":"self_serve"' '"registration_mode":"invite_register"';
        sub_filter_once on;
    }
    location = /api/v1/auth/login {
        limit_req zone=trial_login burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
    location / {
        proxy_pass http://frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $trial_connection_upgrade;
        # Required for streamed chat responses and large file transfers.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
